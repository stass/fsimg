name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    # Each platform reports its own result; one failing must not cancel the
    # other mid-run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Development tools
        run: |
          if [ "$(uname -s)" = Darwin ]; then
            brew install autoconf automake libtool cmake mtools dosfstools pkgconf ruby xz zstd
            # Homebrew's Ruby is keg-only; the system Ruby is older than 3.2.
            echo "$(brew --prefix ruby)/bin" >> "$GITHUB_PATH"
          else
            sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
            sudo apt-get update
            sudo apt-get install -y autoconf automake libtool clang mtools dosfstools exfatprogs pkg-config ruby ruby-dev ruby-bundler dpkg-dev liblzma-dev xz-utils libzstd-dev zstd
          fi
          echo "BUNDLE_PATH=$RUNNER_TEMP/spec-gems" >> "$GITHUB_ENV"
      - name: Instrumented zlib for MemorySanitizer
        if: runner.os == 'Linux'
        run: |
          source_parent=$(mktemp -d)
          (cd "$source_parent" && apt-get source zlib)
          sh build-aux/build-msan-zlib.sh "$source_parent"/zlib-*/ "$RUNNER_TEMP/zlib-msan"
          rm -rf "$source_parent"
          echo "MSAN_ZLIB=$RUNNER_TEMP/zlib-msan" >> "$GITHUB_ENV"
      - name: Ruby version
        id: ruby
        run: echo "version=$(ruby -e 'print RUBY_VERSION')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spec-gems
          key: spec-gems-${{ matrix.os }}-ruby-${{ steps.ruby.outputs.version }}-${{ hashFiles('test/spec/Gemfile.lock') }}
      - name: Specification test gems
        run: BUNDLE_FROZEN=true bundle install --gemfile=test/spec/Gemfile
      - name: Build and check
        run: |
          if [ "$(uname -s)" = Darwin ]; then
            sh build-aux/build-fatcat.sh "$RUNNER_TEMP/fsimg-fatcat"
            export FATCAT="$RUNNER_TEMP/fsimg-fatcat/build/fatcat"
          fi
          autoreconf -fi
          mkdir build
          cd build
          # The optional compression libraries are required here, so a
          # build that silently lost one fails; the GCC 13 job builds without.
          ../configure CC=clang CXX=clang++ --with-xz=yes --with-zstd=yes
          make -j2
          sh ../build-aux/ci-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.os }}
          path: |
            build/**/*.log
            build/test/spec-results/*/coverage.json
            build/test/spec-results/*/summary.txt
            build/test/spec-results/*/failures/
  gcc:
    # The native jobs build with Clang; GCC's -Wmaybe-uninitialized and
    # -Wformat-truncation analyses differ, and -Werror makes them build breaks.
    # An older and the newest GCC major run in the official gcc images: the
    # newest compiles the optional compression libraries, the older builds
    # without them, so GCC sees both configurations.
    strategy:
      fail-fast: false
      matrix:
        include:
          - gcc: '13'
            codecs: --without-xz --without-zstd
          - gcc: '16'
            codecs: --with-xz=yes --with-zstd=yes
    runs-on: ubuntu-24.04
    container: gcc:${{ matrix.gcc }}
    steps:
      - uses: actions/checkout@v4
      - name: Development tools
        run: |
          apt-get update
          apt-get install -y autoconf automake libtool make mtools dosfstools exfatprogs pkg-config ruby ruby-minitest libssl-dev libyaml-dev libreadline-dev zlib1g-dev liblzma-dev libzstd-dev xz-utils zstd
          useradd -m builder
          chown -R builder .
      - name: Ruby 3.2 floor
        if: matrix.gcc == '13'
        run: |
          cd /tmp
          curl -fsSLO https://cache.ruby-lang.org/pub/ruby/3.2/ruby-3.2.11.tar.xz
          echo 'c13aec0c206725d5d356acbae6e5fd8bffd92dc325aec14fd5dd7795d4b763d2  ruby-3.2.11.tar.xz' | sha256sum -c -
          tar -xf ruby-3.2.11.tar.xz -C /tmp
          cd /tmp/ruby-3.2.11
          ./configure --prefix=/opt/ruby-3.2 --disable-install-doc
          make -j2
          make install
          echo '/opt/ruby-3.2/bin' >> "$GITHUB_PATH"
      - name: Build and check
        # Container steps run as root; the suite expects an unprivileged user.
        run: |
          export FSIMG_CI_RUBY="$(command -v ruby)"
          export FSIMG_CI_CODECS="${{ matrix.codecs }}"
          su builder -c 'set -e
          autoreconf -fi
          mkdir build
          cd build
          ../configure CC=gcc CXX=g++ RUBY="$FSIMG_CI_RUBY" $FSIMG_CI_CODECS
          make -j2
          make check
          grep -q "^:test-result: PASS" test/cli.sh.trs'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-gcc-${{ matrix.gcc }}
          path: build/**/*.log
  freebsd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            set -eu
            # The base system's zstd library is private; the package
            # installs the public one with its pkg-config file. liblzma is
            # in base.
            ASSUME_ALWAYS_YES=yes pkg install -y autoconf automake libtool \
                cmake-core git-lite mtools pkgconf rubygem-bundler \
                rubygem-minitest python3 zstd
            pw useradd fsimgtest -m -s /bin/sh
          run: |
            chown -R fsimgtest .
            su -m fsimgtest -c '
              set -eu
              oracle_parent=$(mktemp -d)
              sh build-aux/build-fatcat.sh "$oracle_parent/fatcat"
              export FATCAT="$oracle_parent/fatcat/build/fatcat"
              # The interpreter bundle runs on, from its shebang: the Ruby
              # port may install only a versioned one, such as ruby33.
              ruby=$(sed -n '1s/^#! *//p' "$(command -v bundle)")
              test -x "$ruby"
              export BUNDLE_PATH="$oracle_parent/spec-gems"
              BUNDLE_FROZEN=true bundle install --gemfile=test/spec/Gemfile
              autoreconf -fi
              mkdir build
              cd build
              ../configure CC=clang CXX=clang++ RUBY="$ruby" --with-xz=yes --with-zstd=yes
              make -j2
              sh ../build-aux/ci-check.sh
            '
